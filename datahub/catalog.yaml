# 공유 데이터 카탈로그 — "무엇이 어디 있고 누가 쓰는가"의 기준 (설계 §2.4.2)
# 새 코드는 하드코딩 경로 대신 datahub.catalog.path("daily", code="005930") 를 쓴다.
version: 1

calendar:
  source: data/index/daily/001.csv   # 지나간 거래일 = 코스피 지수 봉이 있는 날
  # 앞으로의 KRX 휴장일. KRX 사이트의 휴장일 조회(data.krx.co.kr·global.krx.co.kr)는 스크립트 접근을 302/403 으로 막아
  # 자동 조회가 안 된다. 그래서 (1) 실측 (2) 공휴일 규정 + KRX 휴장 선례로 채웠다 — 매년 사람이 KRX 공지와 대조할 것.
  #  · 2026-09-24, 09-25 추석: 2026-09-25 코스피 지수 일봉 API 가 09-23 까지만 돌려줌 + 소피증권 WebSocket 접속 즉시 끊김(실측).
  #  · 2026-10-05 개천절(10/3 토) 대체공휴일: 국경일 4종은 토요일과 겹치면 대체(ko.wikipedia 대한민국의 공휴일, 현행 규정).
  #    선례: 광복절 8/15(토)의 대체 8/17(월)에 KRX 지수 봉이 없다(로컬 data/index/daily/001.csv).
  #  · 2026-10-09 한글날(금), 2026-12-25 성탄절(금): 법정공휴일(같은 문서). 선례: 제헌절 07-17·노동절 05-01 도 봉 없음.
  #  · 2026-12-31 연말 휴장: 선례 2025-12-31 에 봉 없음. 매년 KRX 는 연말 마지막 거래일에 휴장한다.
  # 넣지 않은 날짜: 2026-09-28(추석 연휴 3일 9/24~9/26 이 토요일에 끝나 대체공휴일 대상이 아니라고 읽히나 확인 못 함 — 거래일로 둠),
  # 임시공휴일(정부가 수시 지정) — 지정되면 사람이 추가. 지수 봉이 쌓이면(지나간 날) 이 목록은 필요 없어진다.
  holidays: ["2026-09-24", "2026-09-25", "2026-10-05", "2026-10-09", "2026-12-25", "2026-12-31"]

locks:
  daily_minute: {path: state/locks/data_daily_minute, covers: [daily, minute_krx, index]}
  minute_al:    {path: state/locks/data_minute_al,    covers: [minute_al, minute_al_archive]}
  tick_al:      {path: state/locks/data_tick_al,      covers: [tick_al]}

datasets:
  - id: daily
    label: 일봉
    basis: KRX
    path: data/stocks/daily/{code}.csv
    lock: daily_minute
    writers:
      - {id: backfill,   cmd: backfill_universe.py,                      triggers: [hub, "watchdog:daily_report"]}
      - {id: top35,      cmd: "backtesting/updater.py:update_top35",     triggers: ["8765:15:40", "watchdog:daily_report"]}
      - {id: fill_daily, cmd: kospi-theme-engine/scripts/fill_daily.py,  triggers: [manual]}
    readers: [소피증권 엔진(시작 시 전일 종가·신고가), "8765", studio, 연구]
    freshness: {rule: last_trading_day, deadline: "07:30"}
    retention: keep
    notes: 거래대금은 종가×거래량(KRX) 근사

  - id: minute_krx
    label: 1분봉(KRX)
    basis: KRX
    path: data/stocks/minute/{code}.csv
    lock: daily_minute
    writers:
      - {id: backfill, cmd: backfill_universe.py,                   triggers: [hub, "watchdog:daily_report"]}
      - {id: top35,    cmd: "backtesting/updater.py:update_top35",  triggers: ["8765:15:40", "watchdog:daily_report"]}
    readers: [소피증권 재생·기준선, 연구]
    freshness: {rule: last_trading_day, deadline: "07:30"}
    retention: keep
    notes: 거래대금 신호에 쓰지 말 것 — AL(통합) 규칙. parquet 사본이 같은 폴더에 있을 수 있음(읽는 쪽이 우선 사용)

  - id: index
    label: 지수 일봉·분봉
    basis: KRX
    path: data/index/{kind}/{code}.csv
    lock: daily_minute
    writers:
      - {id: update_indexes, cmd: "daily_report_job.py:update_indexes", triggers: ["watchdog:daily_report"]}
    readers: [studio, 연구]
    freshness: {rule: last_trading_day, deadline: "07:30"}
    retention: keep
    notes: 값 ×100 스케일. kind=daily|minute, code=001(코스피)|101(코스닥)

  - id: minute_al
    label: 통합 1분봉 캐시
    basis: AL
    path: kospi-theme-engine/data/cache/minute_al/{code}.csv
    lock: minute_al
    writers:
      - {id: fetch_minute, cmd: kospi-theme-engine/scripts/fetch_minute.py, triggers: ["watchdog:minute_refresh", hub, manual]}
    readers: [소피증권 prepare, 거래대금 순위, 연구]
    freshness: {rule: max_age_days, good: 14, warn: 21}
    retention: overwrite_20d
    notes: fetch_minute 이 갱신마다 최근 20거래일로 통째로 교체 — 이력은 minute_al_archive 가 보관

  - id: minute_al_archive
    label: 통합 1분봉 보관소
    basis: AL
    path: data/stocks/minute_al_archive/{code}.parquet
    lock: minute_al
    writers:
      - {id: fetch_minute, cmd: kospi-theme-engine/scripts/fetch_minute.py, triggers: ["watchdog:minute_refresh", hub, manual]}
      - {id: archive,      cmd: "python -m datahub archive-minute-al",      triggers: [hub, manual]}
    readers: [studio 분봉]
    freshness: {rule: archive_superset}
    retention: forever
    notes: 캐시 ⊆ 보관소. 열 date(인덱스)·open·high·low·close·volume

  - id: tick_al
    label: 통합 체결
    basis: AL
    path: data/stocks/tick_al/{code}/{date}.parquet
    lock: tick_al
    writers:
      - {id: tick_collect, cmd: tick_collect_804_828_al.py, triggers: [hub, manual]}
    readers: [studio 틱, 연구]
    # 기대 종목 = 날짜별 전일 거래대금 상위 top_n − 초대형주(data_exclude.MEGA_CAP_EXCLUDE) + extra_codes
    # (수집기 tick_collect_804_828_al.EXTRA_CODES 와 같아야 한다 — 테스트 P7 이 확인)
    freshness: {rule: tick_window, window_days: 20, top_n: 35, extra_codes: ["032820", "030530"]}
    retention: forever_unrecoverable
    notes: 조회창 20거래일 — 놓치면 재수집 불가. 압축 전에는 같은 자리에 .csv

  - id: sophie_reference
    label: 소피증권 기준 데이터
    basis: derived
    path: kospi-theme-engine/data/reference
    also: [kospi-theme-engine/dist/data/reference]
    lock: null
    writers:
      - {id: prepare, cmd: kospi-theme-engine/scripts/prepare.py, triggers: ["watchdog:minute_refresh"]}
    readers: [소피증권 엔진(시작 시)]
    freshness: {rule: dist_sync}
    retention: keep
    notes: 쓰기 표식은 state/minute_refresh (잠금 대신)

  - id: sophie_live_logs
    label: 소피증권 실시간 기록
    basis: derived
    path: kospi-theme-engine/dist/logs
    also: [data/backup/kospi-theme-engine, kospi-theme-engine/backups]
    # 백업 두 곳: 워치독 5분 주기 backup_logs.py -> kospi-theme-engine/backups/surge_YYYYMMDD.jsonl.gz,
    # 재빌드 스크립트 robocopy -> data/backup/kospi-theme-engine/YYYYMMDD/ (평일 15:35 이후만)
    lock: null
    writers:
      - {id: engine,      cmd: kospi-theme-engine/dist/ai_stock.exe,  triggers: [live]}
      - {id: backup_logs, cmd: kospi-theme-engine/backup_logs.py,    triggers: ["watchdog"]}
    readers: [연구]
    freshness: {rule: backup_exists}
    retention: forever_unrecoverable
    notes: 실시간 시계열이라 재수집 불가 — 삭제 금지·압축 보관

  - id: reference_static
    label: 종목명·업종·테마
    basis: reference
    path: data/stock_names.json
    also: [data/sectors.csv, data/themes.csv, data/theme_group_map.csv]
    lock: null
    writers:
      - {id: manual, cmd: manual, triggers: [manual]}
    readers: [전부]
    freshness: {rule: none}
    retention: keep

  - id: high120
    label: 120일 신고가
    basis: derived
    path: data/high120.csv
    lock: null
    writers:
      - {id: daily_report, cmd: daily_report_job.py, triggers: ["watchdog:daily_report"]}
    readers: ["8765"]
    freshness: {rule: last_trading_day, deadline: "07:30"}
    retention: regenerable

  - id: daily_all_cache
    label: 일봉 합본
    basis: derived
    path: data/cache/daily_all.parquet
    lock: null
    writers:
      - {id: rebuild, cmd: "backtesting/daily_cache.py:load_daily_all", triggers: [reader]}
    readers: [studio, 연구]
    freshness: {rule: newer_than_source}
    retention: regenerable

# 일정·알림은 값만 적는다. 실행은 module-2 (scheduler.py / alerts.py).
schedules:
  - {id: daily_report, label: "야간 갱신", owner: watchdog, when: "평일 16:00 이후 1회",              does: "야간 갱신(top35·백필·지수·신고가·리포트)",   default: observe}
  - {id: minute_refresh, label: "분봉 기준선 갱신",  owner: watchdog, when: "토 09:00 이후, 마지막 완료 13일 뒤", does: "소피증권 통합 분봉 기준선 갱신",             default: observe}
  - {id: top35_live, label: "top35 증분",      owner: "8765",   when: "평일 15:40",                       does: "top35 증분",                                default: observe}
  - {id: sophie_restart, label: "소피증권 자정 재기동",  owner: sophie,   when: "매일 00:05",                       does: "엔진 재기동(restart_after_midnight.ps1)",    default: observe}
  - {id: sophie_rebuild, label: "소피증권 재빌드",  owner: sophie,   when: "평일 15:35",                       does: "exe 재빌드·재기동(rebuild_after_close.ps1)", default: observe}
  - {id: tick_nightly, label: "체결 야간 수집",    owner: hub,      when: "매일 20:15",                       does: "조회창 안 빠진 (종목, 날짜) 전부 수집 → 압축", default: "on"}
  - {id: daily_catchup, label: "일봉 아침 따라잡기",   owner: hub,      when: "거래일 05:30~08:10",               does: "일봉이 밀렸을 때만 밀린 종목 따라잡기",       default: "on"}
  - {id: minute_archive, label: "분봉 보관소 병합",  owner: hub,      when: "매일 21:00",                       does: "캐시 중 보관소보다 새 파일 병합(안전망)",     default: "on"}
  - {id: freshness_check, label: "신선도 점검·알림", owner: hub,      when: "10분마다",                         does: "상태 계산 + 알림",                            default: "on"}

alerts:
  - {id: daily_stale_before_open, title: "장 시작 전 일봉 밀림",  when: "거래일 07:30 에 일봉 기준일 < 기대일, 또는 소피증권 유니버스 밀림 > 0", default: "on"}
  - {id: tick_window_loss, title: "체결 조회창 소실 임박",         when: "미수집 체결 날짜가 2거래일 안에 조회창 밖으로",                       default: "on"}
  - {id: archive_behind, title: "분봉 보관 누락",           when: "보관 누락(캐시가 보관소보다 새로움)",                                 default: "on"}
  - {id: dead_lock_owner, title: "죽은 잠금 소유자",          when: "죽은 소유자의 잠금 파일 30분 이상",                                   default: "on"}
  - {id: sophie_stale_day, title: "소피증권 어제 상태",         when: "거래일 08:20 에 소피증권 엔진 시작 시각이 오늘 00:00 이전",           default: "on"}
  - {id: tick_nightly_failed, title: "체결 야간 수집 이틀 연속 실패",      when: "이틀 밤 연속, 회차를 다 돌았는데도 빠진 (종목, 날짜)가 남음",         default: "on"}
  - {id: tick_given_up, title: "체결 수동 확인 필요",            when: "3일 밤 실패로 수동 확인 필요 목록에 새로 들어감",                     default: "on"}
  - {id: daily_catchup_incomplete, title: "일봉 아침 따라잡기 미완", when: "아침 따라잡기가 08:10 까지 못 끝냄",                                  default: "on"}
  - {id: unledgered_write, title: "장부 없는 쓰기",         when: "장부 없는 쓰기 감지",                                                 default: "off"}
