<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>매매 데스크</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root { --bg:#0a0d12; --card:#10141b; --line:#1e2530; --line2:#27303c; --chip:#1a212b; --text:#e8ebf0; --dim:#8d96a5;
  --up:#ff5c63; --dn:#4d8dff; --acc:#6d9bff; --acc-soft:#16213a; --acc-line:#3a4a6b; --gold:#e2b65a; --ok:#3ccf7e; --tag:#dfe4ec;
  --mono:'JetBrains Mono',ui-monospace,monospace; color-scheme: dark; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 13px/1.4 'IBM Plex Sans KR', system-ui, sans-serif; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--acc); }
.mono { font-family: var(--mono); }
.dim { color: var(--dim); }
.up { color: var(--up); } .dn { color: var(--dn); }
.wrap { padding: 12px; display: flex; flex-direction: column; gap: 10px; min-height: 100vh; }
[hidden] { display: none !important; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
.row { display: flex; gap: 10px; align-items: center; }
.btn { min-height: 36px; padding: 0 12px; background: var(--chip); border: 1px solid var(--line2); border-radius: 7px; }
.btn:hover { border-color: var(--acc-line); }
.btn.ghost { background: transparent; color: var(--acc); border: 1px dashed #2a3a5c; }
.btn.red { background: var(--up); color: var(--bg); border: 0; font-weight: 700; }
.btn.blue { background: var(--dn); color: var(--bg); border: 0; font-weight: 700; }
.btn.warn { background: transparent; color: var(--up); border-color: #6b2a2e; font-weight: 700; }
.btn.x { width: 32px; min-height: 32px; padding: 0; background: transparent; color: var(--dim); }
.in { height: 36px; background: var(--bg); border: 1px solid var(--line2); border-radius: 7px; padding: 0 10px; min-width: 0; }
.in.num { font-family: var(--mono); text-align: right; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 3px; background: var(--bg); border: 1px solid var(--line2); border-radius: 8px; padding: 3px; }
.seg button { min-height: 38px; border: 1px solid transparent; border-radius: 6px; background: transparent; color: var(--dim); font-weight: 600; }
.seg button[aria-pressed="true"].b { background: var(--up); color: var(--bg); }
.seg button[aria-pressed="true"].s { background: var(--dn); color: var(--bg); }
.seg button[aria-pressed="true"].g { background: #2a2210; border-color: #5a4a22; color: var(--gold); }
.lbl { color: var(--dim); font-size: 12px; }
header.card { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 22px; padding: 10px 16px; }
.kpi { display: flex; flex-direction: column; gap: 2px; } .kpi b { font: 600 14px var(--mono); }
.live { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--dim); }
.live i { width: 7px; height: 7px; border-radius: 50%; background: var(--dim); } .live.on i { background: var(--ok); }
.banner { border-radius: 10px; padding: 10px 14px; background: #2a1416; border: 1px solid #6b2a2e; color: #ffb3b6; }
.banner.info { background: #2a2210; border-color: #5a4a22; color: var(--gold); }
.main { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-start; }
#left { flex: 1 1 220px; max-width: 250px; display: flex; flex-direction: column; gap: 8px; }
#center { flex: 999 1 520px; min-width: 0; display: flex; flex-direction: column; gap: 10px; }
#bookcol { flex: 0 1 270px; min-width: 250px; }
#order { flex: 1 1 290px; max-width: 330px; display: flex; flex-direction: column; gap: 12px; }
.w { display: flex; align-items: center; gap: 8px; padding: 8px; border-radius: 8px; border: 1px solid transparent; }
.w.on { background: var(--acc-soft); border-color: var(--acc-line); }
.w > button.pick { flex: 1; min-width: 0; display: grid; grid-template-columns: 1fr auto; gap: 1px 8px; background: none; border: 0; padding: 0; text-align: left; }
.w .nm { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.w .sub { grid-column: 1 / -1; font: 11px var(--mono); color: var(--dim); }
.st { font-size: 11px; } .st.보유 { color: var(--ok); } .st.주문중 { color: var(--gold); } .st.대기 { color: var(--dim); }
#charts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.ch { display: flex; flex-direction: column; gap: 6px; min-width: 0; cursor: default; }
.ch.on { border-color: var(--acc-line); }
.ch .hd { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.ch .tfs button { font-size: 11px; padding: 2px 8px; border-radius: 5px; border: 0; background: transparent; color: var(--dim); }
.ch .tfs button[aria-pressed="true"] { background: var(--chip); color: var(--text); }
.ch svg { width: 100%; height: 250px; display: block; pointer-events: none; }
.ch .plot { position: relative; } .ch .plot .empty { height: 250px; }
.ch .hit { position: absolute; inset: 0; touch-action: pan-y; cursor: crosshair; }   /* 세로 스크롤은 페이지, 두 손가락·가로 끌기는 차트 */
.zm { display: flex; gap: 2px; } .zm button { width: 30px; height: 26px; border-radius: 5px; border: 1px solid var(--line2); background: transparent; color: var(--dim); padding: 0; font-size: 14px; }
.empty { display: grid; place-items: center; height: 250px; color: var(--dim); }
table { width: 100%; border-collapse: collapse; }
th { font-weight: 500; color: var(--dim); font-size: 12px; padding: 6px 8px; text-align: right; }
td { padding: 7px 8px; text-align: right; border-top: 1px solid var(--line); font-family: var(--mono); }
th:first-child, td:first-child { text-align: left; } td:first-child { font-family: inherit; font-weight: 600; }
.tabs { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 8px; }
.tabs button { min-height: 34px; padding: 0 14px; border-radius: 7px; border: 1px solid var(--line2); background: transparent; color: var(--dim); }
.tabs button[aria-pressed="true"] { background: var(--acc-soft); border-color: var(--acc-line); color: var(--text); }
.scroll { overflow-x: auto; }
.bk span { white-space: nowrap; } .bk { display: grid; grid-template-columns: 1fr 72px 54px 1fr; gap: 6px; align-items: center; height: 19px; font: 12px var(--mono); }
.bk .bar { position: relative; height: 15px; } .bk .bar i { position: absolute; top: 0; bottom: 0; border-radius: 2px; opacity: .18; }
.bk .bar span { position: relative; color: var(--dim); padding: 0 4px; }
.bk button { height: 18px; padding: 0; border: 0; border-radius: 3px; background: transparent; font: 12px var(--mono); }
.bk button.cur { background: var(--tag); color: var(--bg); }
.bk button.sel { outline: 1px solid var(--acc); }
fieldset { border: 1px solid var(--line); border-radius: 8px; margin: 0; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
legend { color: var(--dim); font-size: 12px; padding: 0 4px; }
.grid2 { display: grid; grid-template-columns: 76px 1fr; gap: 8px 10px; align-items: center; }
.lad { display: grid; grid-template-columns: 62px minmax(0,1fr) minmax(0,1fr) 30px; gap: 6px; align-items: center; }
.msgs { font-size: 12px; display: flex; flex-direction: column; gap: 3px; max-height: 220px; overflow: auto; }
.msgs .error { color: #ffb3b6; } .msgs .warn { color: var(--gold); }
dialog { background: var(--card); color: var(--text); border: 1px solid var(--line2); border-radius: 12px; padding: 18px; max-width: 380px; }
dialog::backdrop { background: rgba(0,0,0,.55); }
/* 규칙 화면 */
#rulesView { display: none; } body.rules #deskView { display: none; } body.rules #rulesView { display: flex; }
.rl { display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 8px; border: 1px solid transparent; }
.rl.on { background: var(--acc-soft); border-color: var(--acc-line); }
.sw { position: relative; width: 40px; height: 24px; flex: none; border-radius: 12px; border: 0; padding: 0; background: var(--line2); }
.sw[aria-pressed="true"] { background: var(--ok); }
.sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: var(--text); transition: left .15s; }
.sw[aria-pressed="true"]::after { left: 19px; }
.cond { display: grid; grid-template-columns: 28px minmax(0,2.2fr) minmax(0,1.2fr) minmax(0,1fr) 40px; gap: 8px; align-items: center; }
.ex { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line); }
.ex.on { border-color: #2a3a5c; background: #10182a; }
.prob { color: var(--gold); font-size: 12px; }
@media (max-width: 760px) { #left, #order, #bookcol { max-width: none; flex-basis: 100%; } #charts { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="card">
    <div class="row"><strong style="font-size:16px">매매 데스크</strong><span id="live" class="live"><i></i><span>연결 확인 중</span></span></div>
    <div class="row" style="flex:1 1 auto;flex-wrap:wrap;gap:22px">
      <div class="kpi"><span class="lbl">예수금</span><b id="kDep">—</b></div>
      <div class="kpi"><span class="lbl">평가금액</span><b id="kEq">—</b></div>
      <div class="kpi"><span class="lbl">평가손익</span><b id="kEval">—</b></div>
      <div class="kpi"><span class="lbl">오늘 실현손익</span><b id="kReal">—</b></div>
      <div class="kpi"><span class="lbl">일일 손실 한도</span><b id="kLim">—</b></div>
    </div>
    <button class="btn" id="toRules" type="button">매수·청산 규칙</button>
    <button class="btn warn" id="liq" type="button">전체 청산</button>
  </header>
  <div id="banner"></div>

  <div id="deskView" class="main">
    <section id="left" class="card" aria-label="내가 고른 종목">
      <div class="row" style="justify-content:space-between"><strong style="font-size:14px">내가 고른 종목</strong><span class="dim" id="wCount"></span></div>
      <div class="row" style="gap:6px">
        <label for="add" class="dim" style="position:absolute;width:1px;height:1px;overflow:hidden">종목 추가</label>
        <input id="add" class="in" list="addList" placeholder="종목명·코드" style="flex:1" autocomplete="off">
        <datalist id="addList"></datalist>
        <button class="btn" id="addBtn" type="button">추가</button>
      </div>
      <div id="wlist" style="display:flex;flex-direction:column;gap:2px"></div>
      <div style="border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:6px">
        <span class="lbl">체크한 <b id="ckN">0</b>종목</span>
        <button class="btn blue" id="sellChecked" type="button" style="min-height:44px">일괄 매도</button>
        <span class="dim" style="font-size:11px">체크한 종목의 보유 수량을 전부 매도</span>
      </div>
    </section>

    <div id="center">
      <section id="charts" aria-label="차트"></section>
      <section class="card" aria-label="잔고와 주문">
        <div class="tabs" id="tabs">
          <button type="button" data-t="pos" aria-pressed="true">보유 <span id="nPos"></span></button>
          <button type="button" data-t="open" aria-pressed="false">미체결 <span id="nOpen"></span></button>
          <button type="button" data-t="plan" aria-pressed="false">종목 계획 <span id="nPlan"></span></button>
          <button type="button" data-t="fill" aria-pressed="false">오늘 체결</button>
          <button type="button" data-t="jr" aria-pressed="false">선정 일지</button>
          <button type="button" data-t="log" aria-pressed="false">알림</button>
        </div>
        <div class="scroll" id="tabBody"></div>
      </section>
    </div>

    <section id="bookcol" class="card" aria-label="호가">
      <div class="row" style="gap:8px;margin-bottom:6px"><strong style="font-size:14px">호가</strong><span class="dim" id="bkName"></span><span class="dim" style="margin-left:auto;font-size:11px">가격 누르면 주문가로</span></div>
      <div class="bk dim" style="font-size:11px"><span style="text-align:right">매도잔량</span><span style="text-align:center">호가</span><span style="text-align:right">등락률</span><span>매수잔량</span></div>
      <div id="book"></div>
    </section>

    <section id="order" class="card" aria-label="주문">
      <div class="row" style="gap:8px;align-items:baseline"><strong style="font-size:16px" id="oName">종목을 고르세요</strong><span class="mono" id="oPx" style="font-size:15px"></span><span id="oChg" class="mono"></span></div>
      <div class="seg"><button type="button" class="b" id="sBuy" aria-pressed="true">매수</button><button type="button" class="s" id="sSell" aria-pressed="false">매도</button></div>
      <div class="grid2">
        <label for="oType" class="lbl">주문 방식</label>
        <select id="oType" class="in"><option value="limit">지정가</option><option value="market">시장가</option></select>
        <label for="oPrice" class="lbl">가격</label><input id="oPrice" class="in num" inputmode="numeric">
        <label for="oQty" class="lbl">수량</label><input id="oQty" class="in num" inputmode="numeric" value="0">
      </div>
      <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px" id="pcts">
        <button type="button" class="btn" data-p="10">10%</button><button type="button" class="btn" data-p="25">25%</button>
        <button type="button" class="btn" data-p="50">50%</button><button type="button" class="btn" data-p="100">최대</button>
      </div>
      <div class="row" style="justify-content:space-between"><span class="lbl">예상 주문금액</span><b class="mono" id="oAmt">—</b></div>
      <button type="button" class="btn red" id="oSubmit" style="min-height:48px;font-size:15px">매수</button>

      <fieldset style="border-color:#3a2a2e">
        <legend style="color:var(--up);font-weight:600">기준일 종가 분할매수 (지정가로 미리 걸기)</legend>
        <div class="row" style="gap:6px"><label for="setSel" class="lbl" style="white-space:nowrap">매수 세트</label>
          <select id="setSel" class="in" style="flex:1"></select>
          <button type="button" class="btn" id="setSave" style="min-height:36px;font-size:12px">세트로 저장</button></div>
        <div class="row" style="gap:6px" id="setNameRow" hidden><input id="setName" class="in" placeholder="세트 이름 (예: 눌림 A)" style="flex:1" aria-label="세트 이름">
          <button type="button" class="btn red" id="setOk" style="min-height:36px;font-size:12px">저장</button><button type="button" class="btn" id="setDel" style="min-height:36px;font-size:12px" hidden>지우기</button></div>
        <div class="row" style="justify-content:space-between;gap:6px"><label for="planRule" class="lbl">체결되면 청산</label>
          <select id="planRule" class="in" style="flex:1;max-width:210px"></select></div>
        <div class="row" style="gap:6px"><label for="refDay" class="lbl" style="white-space:nowrap">기준일</label>
          <input type="date" id="refDay" class="in mono" style="flex:1;color-scheme:dark" aria-describedby="refNote">
          <button type="button" class="btn" id="refAuto" style="min-height:36px;font-size:12px" title="최근 신고대금 날(없으면 직전 거래일)">신고대금 날</button>
          <button type="button" class="btn" id="refClear" style="min-height:36px;font-size:12px">직전 거래일</button></div>
        <span class="dim" id="refNote" style="font-size:11px;margin-top:-4px">종목마다 따로 저장됩니다 · 비우면 직전 거래일</span>
        <div class="seg"><button type="button" class="g" id="bReg" aria-pressed="false"><span style="font-size:11px">정규장 종가</span><br><span class="mono" id="vReg">—</span></button>
          <button type="button" class="g" id="bAft" aria-pressed="true"><span style="font-size:11px">애프터 종가</span><br><span class="mono" id="vAft">—</span></button></div>
        <div class="lad dim" style="font-size:11px"><span>기준 대비</span><span style="text-align:right">주문 가격</span><span style="text-align:right">금액(원)</span><span></span></div>
        <div id="ladRows" style="display:flex;flex-direction:column;gap:6px"></div>
        <div class="row" style="gap:6px;flex-wrap:wrap"><label for="keepMode" class="lbl">유지</label>
          <select id="keepMode" class="in" style="flex:1"><option value="today">오늘만</option><option value="days">며칠 동안</option><option value="until">날짜까지</option><option value="forever">취소할 때까지</option></select>
          <input id="keepDays" class="in num" style="width:64px" value="5" aria-label="유지 거래일 수" hidden><input type="date" id="keepUntil" class="in mono" style="color-scheme:dark" aria-label="유지 마지막 날" hidden></div>
        <span class="dim" style="font-size:11px;margin-top:-4px">안 닿은 단계는 다음 거래일 08:00 뒤에 다시 겁니다 · 예약 매수 탭에서 취소</span>
        <div class="row" style="gap:6px"><button type="button" class="btn ghost" id="ladAdd">+ 단계</button><button type="button" class="btn red" id="ladGo" style="flex:1">걸기</button></div>
      </fieldset>

      <fieldset>
        <legend>청산 규칙 (이 화면에서 산 종목에 체결 즉시)</legend>
        <div class="row" style="justify-content:space-between"><label for="manRule" class="lbl">청산 규칙</label>
          <select id="manRule" class="in" style="flex:1;max-width:190px"></select></div>
        <div id="exitSum" class="dim" style="font-size:12px;line-height:1.6"></div>
        <a href="#" id="toRules2" style="font-size:12px">규칙 설정에서 바꾸기 →</a>
      </fieldset>
    </section>
  </div>

  <div id="rulesView" class="main"></div>
</div>

<dialog id="dlg"><p id="dlgText" style="margin:0 0 16px;white-space:pre-line"></p>
  <div class="row" style="justify-content:flex-end"><button class="btn" id="dlgNo" type="button">취소</button><button class="btn red" id="dlgYes" type="button">확인</button></div></dialog>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const fmt = (n) => n == null || isNaN(n) ? "—" : Math.round(n).toLocaleString("ko-KR");
const fp = (n) => n ? fmt(n) : "—";
const pct = (n) => n == null || isNaN(n) ? "" : (n > 0 ? "+" : n < 0 ? "−" : "") + Math.abs(n).toFixed(2) + "%";
const cls = (n) => n > 0 ? "up" : n < 0 ? "dn" : "dim";
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const TICKS = [[2000, 1], [5000, 5], [20000, 10], [50000, 50], [200000, 100], [500000, 500]];
const tick = (p) => (TICKS.find(([b]) => p < b) || [0, 1000])[1];
const floorTick = (p) => Math.floor(p / tick(p) + 1e-9) * tick(p);
const ceilTick = (p) => Math.ceil(p / tick(p) - 1e-9) * tick(p);
const store = { get(k, d) { try { return JSON.parse(localStorage.getItem("td_" + k)) ?? d; } catch { return d; } },
                set(k, v) { try { localStorage.setItem("td_" + k, JSON.stringify(v)); } catch {} } };

async function api(path, opts = {}) {
  const r = await fetch(path, { headers: { "Content-Type": "application/json" }, ...opts, body: opts.body ? JSON.stringify(opts.body) : undefined });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.detail || r.statusText);
  return j;
}
function ask(text) {
  return new Promise((res) => { $("dlgText").textContent = text; const d = $("dlg"); d.showModal();
    $("dlgYes").onclick = () => { d.close(); res(true); }; $("dlgNo").onclick = () => { d.close(); res(false); }; });
}

let S = null, RULES = null, active = store.get("active", null), side = "buy", base = store.get("base", "aft"), userPx = null, tab = "pos";
const checked = new Set(store.get("checked", []));
let ladder = store.get("ladder", [{ pct: "-3", amt: "" }, { pct: "-5", amt: "" }]);
const tfOf = store.get("tf", {}), sessOf = store.get("sess", {});
for (const k in sessOf) if (sessOf[k] === "after") sessOf[k] = "all";   // 옛 '애프터만' 선택은 애프터 포함으로
// 이동평균 — 신고대금 장부와 같다(10-16): 분봉 60·120, 일봉 5·10·20·60·120
const MA_DAY = [[5, "#ff8787"], [10, "#74c0fc"], [20, "#e2b65a"], [60, "#9b7bff"], [120, "#adb5bd"]], MA_MIN = MA_DAY.slice(3);

// ── 실시간(SSE) — 체결가·호가·체결은 서버가 밀어준다. 계좌·미체결 같은 나머지만 2초 폴링 ──
let es = null, esKey = "", raf = 0, lastChartDraw = 0;
const lastCum = {}, dirtyParts = new Set();
function openStream() {

function onLive(d) {

    const w = S.watch.find((x) => x.code === c); if (w) { w.px = q.px; w.chg = q.chg; }
    const h = S.holdings.find((x) => x.code === c); if (h) h.px = q.px;

function flushLive() {

    const wait = 150 - (performance.now() - lastChartDraw);

// 체결로 지금 봉을 키운다 — 분봉 '하루 전체'(실시간이 통합 가격), 정규장 시간이면 '정규장'도. 봉 시각은 시작 시각(키움 분봉과 같다)
function liveBar(code, q) {
  const dv = lastCum[code] != null && q.cum >= lastCum[code] ? q.cum - lastCum[code] : 0;

    if (tf === "D" || !d?.bars?.length || !(ses === "all" || (ses === "reg" && hm >= 900 && hm <= 1530))) continue;
    const m = +tf, mins = Math.floor((dt.getHours() * 60 + dt.getMinutes()) / m) * m;
    const t = `${dt.getFullYear()}${String(dt.getMonth() + 1).padStart(2, "0")}${String(dt.getDate()).padStart(2, "0")}${String(Math.floor(mins / 60)).padStart(2, "0")}${String(mins % 60).padStart(2, "0")}00`;
    const last = d.bars[d.bars.length - 1];
    if (last.t.slice(0, 12) === t.slice(0, 12)) { last.c = q.px; last.h = Math.max(last.h, q.px); last.l = Math.min(last.l, q.px); last.v += dv; }

$("charts").addEventListener("click", (e) => {

  const bars = all.slice(cut), last = bars[bars.length - 1];
  const h = S.holdings.find((x) => x.code === code);

    lines.push([h.avg_price, "#dfe4ec", true, "평단 " + fmt(h.avg_price)]);

    h.takes.forEach((p, i) => lines.push([p, "var(--up)", false, `${i + 1}차 익절 ${fmt(p)}`]));
  }
  S.pending.filter((p) => p.code === code).forEach((p) => lines.push([p.price, p.side === "buy" ? "var(--up)" : "var(--dn)", true, `${p.side === "buy" ? "매수" : "매도"} 대기 ${fmt(p.price)}`]));
  (S.plans || []).filter((p) => p.active && p.code === code).forEach((p) => p.stages.forEach((st) => st.filled < st.qty && lines.push([st.price, "var(--up)", true, `예약 ${st.pct}% ${fmt(st.price)}`])));
  if (code === active && side === "buy") ladderPlan().forEach((o) => o.price && lines.push([o.price, "var(--up)", true, `계획 ${o.pct}% ${fmt(o.price)}`]));
  // 오른쪽 64px 는 가격 칸 — 현재가·십자선 가격표가 봉을 가리지 않게(10-19 사용자 "종가 상자 때문에 현재가 자리가 안 보여", 신고대금 장부 padR 과 같은 방식)
  const W = 600, H = 250, VH = 40, PH = H - VH - 6, n = bars.length, PW = W - 64, bw = PW / Math.max(n, 30);

  const pad = (hi - lo) * 0.06 || hi * 0.01; hi += pad; lo -= pad;
  const y = (v) => ((hi - v) / (hi - lo)) * PH, vmax = Math.max(...bars.map((b) => b.v)) || 1;

  for (let k = 0; k <= 4; k++) { const v = lo + (hi - lo) * k / 4, yy = y(v);   // 가격 눈금
    s += `<line x1="0" x2="${PW}" y1="${yy}" y2="${yy}" stroke="#1a2029" stroke-width=".8"/><text x="${PW + 4}" y="${yy + 4}" font-size="11" fill="#7d8695" font-family="JetBrains Mono">${fmt(v)}</text>`; }

  });

    s += `<line x1="${i * bw}" x2="${i * bw}" y1="0" y2="${H}" stroke="#3a4250" stroke-width="1"/><text x="${i * bw + 3}" y="${PH + 12}" font-size="11" fill="#8d96a5">${b.t.slice(4, 6)}/${b.t.slice(6, 8)}</text>`; } });
  mas.forEach(([vals, col]) => { const pts = vals.map((v, i) => v === null ? "" : `${(i * bw + bw / 2).toFixed(1)},${y(v).toFixed(1)}`).filter(Boolean).join(" ");
    if (pts) s += `<polyline fill="none" stroke="${col}" stroke-width="1.3" clip-path="url(#cp${code})" points="${pts}"/>`; });
  lines.forEach(([p, col, dash, txt]) => { if (p < lo || p > hi) return;

        <span class="dim" style="font-size:12px">체결되면 → ${esc(rname(p.rule))}</span></div>`).join("") : `<div class="dim" style="font-size:12px;border-top:1px solid var(--line);padding-top:6px">예약 없음 — 오른쪽 '기준일 종가 분할매수'에서 겁니다</div>`}
      ${h ? `<div style="border-top:1px solid var(--line);padding-top:6px;display:flex;flex-direction:column;gap:4px">
        <div class="row" style="justify-content:space-between"><span>보유 ${fmt(h.quantity)}주 · 평균 ${fmt(h.avg_price)}</span><b class="${cls(h.pl_pct)}">${pct(h.pl_pct)}</b></div>
        <div style="font-size:12px"><span class="dn">손절 ${fmt(h.stop) || "—"}</span> · <span class="up">익절 ${h.takes.map(fmt).join(" / ") || "—"}</span></div>
        <div class="row" style="gap:6px"><select class="in" data-prule="${h.code}" style="height:30px;flex:1;font-family:inherit" aria-label="청산 규칙">${ruleOpts(h.rule)}</select>
          <button class="btn" type="button" data-exit="${h.code}" style="min-height:30px">청산</button></div></div>` : ""}
      ${np ? `<span class="dim" style="font-size:12px">미체결 ${np}건</span>` : ""}</div>`; }).join("")}</div>`;
}
// 선정 일지 — 30초마다 받아 둔다(탭을 열 때만)
let JR = null, jrAt = 0;
function jrHtml() {
  if (Date.now() - jrAt > 30000) { jrAt = Date.now(); api("/api/journal").then((j) => { JR = j; if (tab === "jr") renderTabs(); }).catch(() => {}); }
  if (!JR) return `<div class="dim" style="padding:12px">불러오는 중…</div>`;
  const rows = JR.rows.slice().reverse();
  if (!rows.length) return `<div class="dim" style="padding:12px">아직 고른 종목이 없습니다 — 종목을 넣거나 신고대금 장부에서 '데스크로'를 누르면 쌓입니다</div>`;
  const avg = (xs) => { const q = xs.reduce((a, x) => a + x[1], 0); return q ? [q, xs.reduce((a, x) => a + x[1] * x[2], 0) / q] : [0, 0]; };
  let w = 0, l = 0;
  const body = rows.map((j) => {
    const [bq, bp] = avg(j.buys), [sq, sp] = avg(j.sells), h = S.holdings.find((x) => x.code === j.code);
    const now = JR.px[j.code] || h?.px || 0;
    const done = sq && bp ? (sp / bp - 1) * 100 : null, open = bq > sq && bp && now ? (now / bp - 1) * 100 : null;
    if (j.closed && done !== null) done > 0 ? w++ : l++;
    return `<tr><td>${esc(j.name)}</td><td style="font-family:inherit">${j.picked.slice(5, 10).replace("-", ".")} <span class="dim">${esc(j.src)}</span></td>
      <td>${j.ref_day ? j.ref_day.slice(4, 6) + "." + j.ref_day.slice(6) : "—"}</td>
      <td>${bq ? fmt(Math.round(bp)) + " × " + fmt(bq) : "<span class='dim'>안 삼</span>"}</td><td>${sq ? fmt(Math.round(sp)) + " × " + fmt(sq) : "—"}</td>
      <td class="${cls(done)}">${done === null ? "" : pct(done)}</td><td class="${cls(open)}">${open === null ? "" : pct(open)}</td>
      <td style="font-family:inherit" class="dim">${j.closed ? "끝 " + j.closed.slice(5, 10).replace("-", ".") : bq ? "보유" : "대기"}</td></tr>`;
  }).join("");
  return `<div class="dim" style="padding:6px 8px">끝난 거래 ${w + l}건 · 이긴 ${w} · 진 ${l}${w + l ? ` · 승률 <b>${Math.round(w / (w + l) * 100)}%</b>` : ""} (수수료·세금 빼기 전)</div>
    <table style="min-width:820px"><thead><tr><th>종목</th><th>고른 날</th><th>기준일</th><th>산 값 × 수량</th><th>판 값 × 수량</th><th>실현</th><th>보유 중</th><th>상태</th></tr></thead><tbody>${body}</tbody></table>`;
}
// 신고대금 장부 '데스크로' — ?add=코드:YYYYMMDD,… 를 받아 종목 + 기준일로 넣고 주소를 지운다
async function takeAdd() {
  const add = new URLSearchParams(location.search).get("add"); if (!add) return;
  history.replaceState(null, "", location.pathname + location.hash);
  const items = add.split(",").map((x) => { const [code, day] = x.split(":"); return { code, day: day || "" }; }).filter((x) => /^\d{6}$/.test(x.code));
  if (!items.length) return;
  const r = await api("/api/pick", { method: "POST", body: { items } }).catch((e) => ({ ok: false, msg: e.message }));
  if (r.ok && r.codes.length) { active = r.codes[r.codes.length - 1]; setTimeout(() => alertMsg(`신고대금 장부에서 ${r.codes.length}종목 넣음 · 기준일 = 신고일`), 2500); }
  else setTimeout(() => alertMsg("종목 넣기 실패 — " + (r.msg || "")), 2500);
}
takeAdd().finally(() => loadRules().then(() => { if (location.hash === "#rules") showRules(true); poll(); setInterval(poll, 2000); setInterval(loadRules, 30000); }));
</script>
