<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>매매 데스크</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root { --bg:#0a0d12; --card:#10141b; --line:#1e2530; --line2:#27303c; --chip:#1a212b; --text:#e8ebf0; --dim:#8d96a5;
  --up:#ff5c63; --dn:#4d8dff; --acc:#6d9bff; --acc-soft:#16213a; --acc-line:#3a4a6b; --gold:#e2b65a; --ok:#3ccf7e; --tag:#dfe4ec;
  --mono:'JetBrains Mono',ui-monospace,monospace; color-scheme: dark; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 13px/1.4 'IBM Plex Sans KR', system-ui, sans-serif; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--acc); }
.mono { font-family: var(--mono); }
.dim { color: var(--dim); }
.up { color: var(--up); } .dn { color: var(--dn); }
.wrap { padding: 12px; display: flex; flex-direction: column; gap: 10px; min-height: 100vh; }
[hidden] { display: none !important; }
table.amt th, table.amt td { text-align: left; } table.amt th { color: var(--dim); font-weight: 500; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
.row { display: flex; gap: 10px; align-items: center; }
.btn { min-height: 36px; padding: 0 12px; background: var(--chip); border: 1px solid var(--line2); border-radius: 7px; }
.btn:hover { border-color: var(--acc-line); }
.btn.ghost { background: transparent; color: var(--acc); border: 1px dashed #2a3a5c; }
.btn.red { background: var(--up); color: var(--bg); border: 0; font-weight: 700; }
.btn.blue { background: var(--dn); color: var(--bg); border: 0; font-weight: 700; }
.btn.warn { background: transparent; color: var(--up); border-color: #6b2a2e; font-weight: 700; }
.btn.x { width: 32px; min-height: 32px; padding: 0; background: transparent; color: var(--dim); }
.in { height: 36px; background: var(--bg); border: 1px solid var(--line2); border-radius: 7px; padding: 0 10px; min-width: 0; }
.in.num { font-family: var(--mono); text-align: right; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 3px; background: var(--bg); border: 1px solid var(--line2); border-radius: 8px; padding: 3px; }
.seg button { min-height: 38px; border: 1px solid transparent; border-radius: 6px; background: transparent; color: var(--dim); font-weight: 600; }
.seg button[aria-pressed="true"].b { background: var(--up); color: var(--bg); }
.seg button[aria-pressed="true"].s { background: var(--dn); color: var(--bg); }
.seg button[aria-pressed="true"].g { background: #2a2210; border-color: #5a4a22; color: var(--gold); }
.lbl { color: var(--dim); font-size: 12px; }
header.card { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 22px; padding: 10px 16px; }
.kpi { display: flex; flex-direction: column; gap: 2px; } .kpi b { font: 600 14px var(--mono); }
.live { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--dim); }
.live i { width: 7px; height: 7px; border-radius: 50%; background: var(--dim); } .live.on i { background: var(--ok); }
.banner { border-radius: 10px; padding: 10px 14px; background: #2a1416; border: 1px solid #6b2a2e; color: #ffb3b6; }
.banner.info { background: #2a2210; border-color: #5a4a22; color: var(--gold); }
.main { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-start; }
#left { flex: 1 1 220px; max-width: 250px; display: flex; flex-direction: column; gap: 8px; }
#center { flex: 999 1 520px; min-width: 0; display: flex; flex-direction: column; gap: 10px; }
#bookcol { flex: 0 1 270px; min-width: 250px; }
#order { flex: 1 1 290px; max-width: 330px; display: flex; flex-direction: column; gap: 12px; }
.w { display: flex; align-items: center; gap: 6px; padding: 8px; border-radius: 8px; border: 1px solid transparent; }
.w.on { background: var(--acc-soft); border-color: var(--acc-line); }
.w .wh { cursor: grab; color: var(--dim); padding: 8px 0; font-size: 16px; line-height: 1; user-select: none; }
.w.dragging { opacity: .4; }
.w.dropup { box-shadow: inset 0 3px 0 var(--acc-line); }
.w.dropdn { box-shadow: inset 0 -3px 0 var(--acc-line); }
.w > button.pick { flex: 1; min-width: 0; display: grid; grid-template-columns: 1fr auto; gap: 1px 8px; background: none; border: 0; padding: 0; text-align: left; }
.w .nm { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; order: -2; }
.w .st { order: -1; text-align: right; }   /* 이름 옆엔 짧은 상태만, 가격·등락률은 둘째 줄 — 250px 칸에서 이름이 한 글자로 잘렸다(11-03 사용자) */
.w .sub { grid-column: 1 / -1; font: 11px var(--mono); color: var(--dim); }
.w .sub > * { display: block; white-space: nowrap; font-style: normal; }   /* 기준 / 종가 / 애프터 — 늘 같은 자리에서 줄 바꿈(11-03 사용자 "등락률 바뀌면서 줄 바꿈") */
.w > button.pick > .mono { white-space: nowrap; }
.w .wa { display: flex; flex-direction: column; align-items: center; gap: 4px; }   /* 자동·빼기 세로로 — 가격·등락률 자리 */
.auto { display: inline-flex; flex-direction: column; align-items: center; gap: 2px; background: none; border: 0; padding: 2px; color: var(--dim); font-size: 10px; cursor: pointer; }
.auto i { width: 26px; height: 14px; border-radius: 999px; background: var(--line2); position: relative; transition: background .15s; }
.auto i::after { content: ""; position: absolute; top: 2px; left: 2px; width: 10px; height: 10px; border-radius: 50%; background: var(--dim); transition: left .15s; }
.auto.on { color: var(--ok); } .auto.on i { background: color-mix(in srgb, var(--ok) 35%, transparent); } .auto.on i::after { left: 14px; background: var(--ok); }
.auto:focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }
.st { font-size: 11px; } .st.보유 { color: var(--ok); } .st.주문중 { color: var(--gold); } .st.대기 { color: var(--dim); }
#charts { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; }   /* 한 줄에 차트 하나 + 그 종목 호가(10-19 사용자 "차트가 너무 작아") */
.chrow { display: flex; gap: 12px; align-items: stretch; min-width: 0; }
.chmain { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.chbook { flex: 0 0 250px; min-width: 0; border-left: 1px solid var(--line); padding-left: 10px; }
@media (max-width: 900px) and (min-width: 601px) { .chrow { flex-direction: column; } .chbook { flex-basis: auto; border-left: 0; padding-left: 0; border-top: 1px solid var(--line); padding-top: 6px; } }
/* 폰: 차트 옆에 좁은 호가(10-20 사용자 "모바일에서 호가창이랑 차트 한 화면에") — 등락률 칸을 빼고 잔량·호가만 */
@media (max-width: 600px) {
  .chrow { gap: 6px; } .chbook { flex: 0 0 140px; padding-left: 5px; }
  .chbook .bk { grid-template-columns: 1fr 44px 1fr; gap: 2px; font-size: 10px; height: 18px; }
  .chbook .bk > :nth-child(3) { display: none; }   /* 폰도 내 주문 칩에 수량 + ✕(10-25 사용자 "수량도 같이") */
  .chbook .bk .bar { white-space: nowrap; overflow: hidden; }  .chbook .bk button { font-size: 10px; height: 17px; } .chbook .bk .bar span { padding: 0 1px; }
  .chbook .mk { font-size: 9px; padding: 0 2px; } .chbook .lg { display: none; } .chbook .bk .bar span.mks { display: none; }
}
.ch { display: flex; flex-direction: column; gap: 6px; min-width: 0; cursor: default; }
/* C 사다리 띠(11-01) — 차트·호가 배치는 그대로, 카드 아래에 가로로. 폰에서는 사다리만 가로로 밀어 본다 */
.flow { border-top: 1px solid var(--line); padding-top: 6px; display: flex; flex-direction: column; gap: 6px; font-size: 12px; }
.flow .frow { display: flex; gap: 8px 14px; align-items: center; flex-wrap: wrap; }
.flow .fsig { display: flex; gap: 8px; align-items: baseline; border: 1px solid var(--sc); border-radius: 7px; padding: 4px 10px; flex: 1 1 340px; min-width: 0; }
.flow .fsig b { color: var(--sc); font-size: 14px; white-space: nowrap; } .flow .fsig span { min-width: 0; }
.flow .fheat { display: flex; gap: 6px; align-items: center; }
.flow .fbar { position: relative; width: 110px; height: 9px; background: var(--chip); border-radius: 5px; overflow: hidden; }
.flow .fbar i { position: absolute; left: 0; top: 0; bottom: 0; } .flow .fbar em { position: absolute; left: 50%; top: 0; bottom: 0; width: 2px; background: var(--text); }
.flow .flad { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(62px, 1fr); gap: 2px; overflow-x: auto; }
.flow .fz { display: flex; flex-direction: column; align-items: center; gap: 1px; padding: 3px 2px; border-radius: 4px; background: color-mix(in srgb, var(--zc) 14%, transparent); border-top: 2px solid var(--zc); font-size: 10px; min-width: 0; }
.flow .fz.now { outline: 2px solid #22d3ee; outline-offset: 1px; transform: translateY(-2px); z-index: 1; } .flow .fz.now .fm { color: #0a0d12; background: #22d3ee; border-radius: 3px; padding: 0 4px; font-weight: 800; } .flow .fz.fc { --zc: var(--gold); background: #2a2210; }
.flow .fz .fl { color: var(--dim); white-space: nowrap; } .flow .fz .fn { font-weight: 600; white-space: nowrap; } .flow .fz .ft { font-family: var(--mono); }
.flow .fz .fm { color: var(--text); font-weight: 600; min-height: 12px; white-space: nowrap; }
.flow .fz .fo { font-size: 11.5px; font-weight: 700; color: var(--text); white-space: nowrap; min-height: 15px; } .flow .fz .fo.mob { color: #0a0d12; background: var(--gold); border-radius: 3px; padding: 0 3px; white-space: normal; line-height: 1.2; }
.flow .fop { display: flex; flex-wrap: wrap; align-items: center; gap: 5px 6px; font-size: 12.5px; margin: 6px 0 4px; } .flow .fop b { font-weight: 700; }
.flow .fop .oc { border: 1px solid var(--line, #2a3140); background: #141a24; border-radius: 4px; padding: 2px 7px; } .flow .fop .oc.warn { border-color: var(--up); background: rgba(255,92,99,.14); }
.flow .fev { display: flex; gap: 4px 14px; flex-wrap: wrap; color: var(--dim); font-size: 11px; }
.ch.on { border-color: var(--acc-line); }
.ch .hd { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
/* 차트 머리 한 줄 — 넓은 화면에선 줄바꿈 없이, 기준·종가 글자가 모자라면 그 칸만 … 로 줄인다(이동평균·확대 버튼까지 맨 윗줄) */
.ch .hd.one { flex-wrap: wrap; white-space: nowrap; } .ch .hd.one > * { flex: 0 0 auto; }   /* 차트 칸이 좁으면 줄을 넘긴다 — 한 줄 고정이면 호가 칸 머리를 덮었다(11-02) */
.ch .hd.one .info { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
@media (max-width: 900px) { .ch .hd.one { flex-wrap: wrap; white-space: normal; } }
.ch .tfs button { font-size: 11px; padding: 2px 8px; border-radius: 5px; border: 0; background: transparent; color: var(--dim); }
.ch .tfs button[aria-pressed="true"] { background: var(--chip); color: var(--text); }
.ch svg { width: 100%; height: 400px; display: block; pointer-events: none; }
.ch .plot { position: relative; } .ch .plot .empty { height: 400px; }
.ch .hit { position: absolute; inset: 0; touch-action: pan-y; cursor: crosshair; }   /* 세로 스크롤은 페이지, 두 손가락·가로 끌기는 차트 */
.zm { display: flex; gap: 2px; } .zm button { width: 30px; height: 26px; border-radius: 5px; border: 1px solid var(--line2); background: transparent; color: var(--dim); padding: 0; font-size: 14px; }
.empty { display: grid; place-items: center; height: 250px; color: var(--dim); }
table { width: 100%; border-collapse: collapse; }
th { font-weight: 500; color: var(--dim); font-size: 12px; padding: 6px 8px; text-align: right; }
td { padding: 7px 8px; text-align: right; border-top: 1px solid var(--line); font-family: var(--mono); }
th:first-child, td:first-child { text-align: left; } td:first-child { font-family: inherit; font-weight: 600; }
.tabs { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 8px; }
.tabs button { min-height: 34px; padding: 0 14px; border-radius: 7px; border: 1px solid var(--line2); background: transparent; color: var(--dim); }
.tabs button[aria-pressed="true"] { background: var(--acc-soft); border-color: var(--acc-line); color: var(--text); }
.scroll { overflow-x: auto; }
.bk span { white-space: nowrap; } .bk { display: grid; grid-template-columns: 1fr 72px 54px 1fr; gap: 6px; align-items: center; height: 19px; font: 12px var(--mono); }
/* 내 주문 칸(10-25 사용자 "영웅문 8282창처럼, x 누르면 취소") — 그 가격에 걸린 미체결 수량 + ✕ */
/* '예약60선' 같은 칩 모양(10-25 사용자) — 가격 바로 오른쪽, 그 가격이 10호가 안에 있을 때만 */
.bk .bar .ords { position: relative; display: inline-flex; gap: 2px; vertical-align: top; } .bk .bar .ords:empty { display: none; }
.bk .bar .ords.l { float: right; margin-left: 2px; } .bk .bar .ords.r { margin-right: 2px; }
.bk .ord { display: inline-flex; align-items: center; gap: 1px; padding-right: 0; }
.bk .ord .q { padding: 0; }
.bk .ord button { width: 13px; height: 13px; flex: 0 0 13px; font: 700 10px/13px sans-serif; color: inherit; border-radius: 2px; }
.bk .ord button:hover, .bk .ord button:focus-visible { background: color-mix(in srgb, currentColor 30%, transparent); outline: none; }
.bk .bar { position: relative; height: 15px; } .bk .bar i { position: absolute; top: 0; bottom: 0; border-radius: 2px; opacity: .18; }
.bk .bar span { position: relative; color: var(--dim); padding: 0 4px; }
.bk .bar span.mks { padding: 0; display: inline-flex; gap: 2px; }
.mk { font: 600 10px 'IBM Plex Sans KR', sans-serif; border: 1px solid; border-radius: 3px; padding: 0 3px; line-height: 13px; white-space: nowrap; }
.lg { font-style: normal; }
.bk button { height: 18px; padding: 0; border: 0; border-radius: 3px; background: transparent; font: 12px var(--mono); }
.bk button.cur { background: var(--tag); color: var(--bg); }
.bk button.sel { outline: 1px solid var(--acc); }
fieldset { border: 1px solid var(--line); border-radius: 8px; margin: 0; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
legend { color: var(--dim); font-size: 12px; padding: 0 4px; }
.grid2 { display: grid; grid-template-columns: 76px 1fr; gap: 8px 10px; align-items: center; }
.lad { display: grid; grid-template-columns: 62px minmax(0,1fr) minmax(0,1fr) 30px; gap: 6px; align-items: center; }
.msgs { font-size: 12px; display: flex; flex-direction: column; gap: 3px; max-height: 220px; overflow: auto; }
.msgs .error { color: #ffb3b6; } .msgs .warn { color: var(--gold); }
dialog { background: var(--card); color: var(--text); border: 1px solid var(--line2); border-radius: 12px; padding: 18px; max-width: 380px; }
dialog::backdrop { background: rgba(0,0,0,.55); }
#cardDlg { max-width: none; width: min(1200px, 94vw); height: 90vh; padding: 0; overflow: hidden; }
#cardDlg iframe { border: 0; width: 100%; height: calc(100% - 40px); display: block; }
/* 규칙 화면 */
#rulesView { display: none; } body.rules #deskView { display: none; } body.rules #rulesView { display: flex; }
.rl { display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 8px; border: 1px solid transparent; }
.rl.on { background: var(--acc-soft); border-color: var(--acc-line); }
.rl[draggable="true"] { cursor: grab; }
.rl.dragging { opacity: .4; }
.rl.dropup { box-shadow: inset 0 3px 0 var(--acc-line); }
.rl.dropdn { box-shadow: inset 0 -3px 0 var(--acc-line); }
.in:disabled { opacity: .35; cursor: not-allowed; }
.tk { border-radius: 6px; }
.tk.dragging { opacity: .4; }
.tk.dropup { box-shadow: inset 0 3px 0 var(--acc-line); }
.tk.dropdn { box-shadow: inset 0 -3px 0 var(--acc-line); }
.tkh { cursor: grab; padding: 4px 2px; color: var(--dim); user-select: none; }
.sw { position: relative; width: 40px; height: 24px; flex: none; border-radius: 12px; border: 0; padding: 0; background: var(--line2); }
.sw[aria-pressed="true"] { background: var(--ok); }
.sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: var(--text); transition: left .15s; }
.sw[aria-pressed="true"]::after { left: 19px; }
.cond { display: grid; grid-template-columns: 28px minmax(0,2.2fr) minmax(0,1.2fr) minmax(0,1fr) 40px; gap: 8px; align-items: center; }
.ex { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line); }
.ex.on { border-color: #2a3a5c; background: #10182a; }
.prob { color: var(--gold); font-size: 12px; }
.grp { border: 1px solid var(--line); border-radius: 8px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.grp-h { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; font-size: 14px; }
.grp-h .dim { font-size: 12px; }
.grp-n { color: var(--up); font-weight: 700; }
.sum { display: grid; grid-template-columns: 92px minmax(0,1fr); gap: 4px 10px; padding: 10px 12px; border-radius: 8px; background: var(--bg); border: 1px solid var(--line2); font-size: 13px; }
.sum > span:nth-child(odd) { color: var(--dim); }
@media (max-width: 760px) { #left, #order, #bookcol { max-width: none; flex-basis: 100%; } #charts { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="card">
    <div class="row"><strong style="font-size:16px">매매 데스크</strong><span id="live" class="live"><i></i><span>연결 확인 중</span></span>
      <button type="button" class="btn ghost" id="sndBtn" style="min-height:28px;padding:0 10px;font-size:12px" title="체결되면 소리 — 매수는 올라가는 소리, 매도는 내려가는 소리">알림음</button></div>
    <div class="row" style="flex:1 1 auto;flex-wrap:wrap;gap:22px">
      <div class="kpi"><span class="lbl">예수금</span><b id="kDep">—</b></div>
      <div class="kpi"><span class="lbl">평가금액</span><b id="kEq">—</b></div>
      <div class="kpi"><span class="lbl">평가손익</span><b id="kEval">—</b></div>
      <div class="kpi"><span class="lbl">오늘 실현손익</span><b id="kReal">—</b></div>
      <div class="kpi"><span class="lbl">일일 손실 한도</span><b id="kLim">—</b></div>
    </div>
    <button class="btn" id="toRules" type="button">매수·청산 규칙</button>
    <a class="btn" href="/guide" target="_blank" rel="noopener" style="display:inline-flex;align-items:center;text-decoration:none;color:inherit">설명서</a>
    <a class="btn" href="/checklist" target="_blank" rel="noopener" style="display:inline-flex;align-items:center;text-decoration:none;color:inherit" title="고친 것이 실제로 되는지 확인 목록">확인표</a>
    <a class="btn" href="/ontology" target="_blank" rel="noopener" style="display:inline-flex;align-items:center;text-decoration:none;color:inherit" title="자료·테마·Jev·허브 경보가 잘 이어져 있는지">온톨로지</a>
    <button class="btn warn" id="liq" type="button">전체 청산</button>
  </header>
  <div id="banner"></div>

  <div id="deskView" class="main">
    <section id="left" class="card" aria-label="내가 고른 종목">
      <div class="row" style="justify-content:space-between"><strong style="font-size:14px">내가 고른 종목</strong><span class="row" style="gap:6px"><button type="button" class="btn ghost" id="valMode" style="min-height:24px;padding:2px 8px;font-size:11px" title="거래대금 기준 — 정규장 09:00~15:30 / 전체 08:00~20:00"></button><span class="dim" id="wCount"></span></span></div>
      <div class="row" style="gap:6px">
        <label for="add" class="dim" style="position:absolute;width:1px;height:1px;overflow:hidden">종목 추가</label>
        <input id="add" class="in" list="addList" placeholder="종목명·코드" style="flex:1" autocomplete="off">
        <datalist id="addList"></datalist>
        <button class="btn" id="addBtn" type="button">추가</button>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
// 종목 한 장(10-23) — 데스크 위에 /card 를 띄운다. 닫으면 비워서 다음에 열 때 새로 받는다
document.addEventListener("DOMContentLoaded", () => {
  $("oCard").onclick = () => { const c = S?.active?.code; if (!c) return; $("cardFrame").src = `/card?code=${c}`; $("cardDlg").showModal(); };
  $("cardClose").onclick = () => $("cardDlg").close();
  $("cardDlg").addEventListener("close", () => { $("cardFrame").src = "about:blank"; });
});
const fmt = (n) => n == null || isNaN(n) ? "—" : Math.round(n).toLocaleString("ko-KR");
const fp = (n) => n ? fmt(n) : "—";
const eok = (v) => v ? fmt(Math.round(v / 1e8)) + "억" : "—";   // 당일 거래대금(통합 08~20시 누적, 0B 14) — 11-03 사용자
const pct = (n) => n == null || isNaN(n) ? "" : (n > 0 ? "+" : n < 0 ? "−" : "") + Math.abs(n).toFixed(2) + "%";
const cls = (n) => n > 0 ? "up" : n < 0 ? "dn" : "dim";
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const TICKS = [[2000, 1], [5000, 5], [20000, 10], [50000, 50], [200000, 100], [500000, 500]];
const tick = (p) => (TICKS.find(([b]) => p < b) || [0, 1000])[1];
const floorTick = (p) => Math.floor(p / tick(p) + 1e-9) * tick(p);
const ceilTick = (p) => Math.ceil(p / tick(p) - 1e-9) * tick(p);
const store = { get(k, d) { try { return JSON.parse(localStorage.getItem("td_" + k)) ?? d; } catch { return d; } },
                set(k, v) { try { localStorage.setItem("td_" + k, JSON.stringify(v)); } catch {} } };
const show = { fill: true, exit: true, avg: true, ...store.get("show", {}) };   // 차트 매수·매도 표시 · 청산 자리(손절·익절·매도 대기) 켜고 끄기 — 모든 차트 같이(11-02 사용자)

async function api(path, opts = {}) {
  const r = await fetch(path, { headers: { "Content-Type": "application/json" }, ...opts, body: opts.body ? JSON.stringify(opts.body) : undefined });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.detail || r.statusText);
  return j;
}
function ask(text) {
  return new Promise((res) => { $("dlgText").textContent = text; const d = $("dlg"); d.showModal();
    $("dlgYes").onclick = () => { d.close(); res(true); }; $("dlgNo").onclick = () => { d.close(); res(false); }; });
}

let S = null, RULES = null, active = store.get("active", null), side = "buy", base = store.get("base", "aft"), userPx = null, tab = "pos", modSel = null;
const checked = new Set(store.get("checked", []));
let ladder = store.get("ladder", [{ pct: "-3", amt: "" }, { pct: "-5", amt: "" }]);
const TF0 = "15";                                                    // 차트 기본 봉 = 15분(11-01 사용자) — 종목마다 고른 봉은 그대로 기억
const tfOf = store.get("tf", {}), sessOf = store.get("sess", {}), cOf = {};   // 차트 C 선 보기 기준 "" = 예약·규칙 따라 — 저장 안 함: 저장된 'C 정규'가 규칙보다 먼저 와서 크롬에서만 규칙 변경이 안 보였다(11-01), 새로고침하면 'C 규칙'
for (const k in sessOf) if (sessOf[k] === "after") sessOf[k] = "all";   // 옛 '애프터만' 선택은 애프터 포함으로
// 이동평균 — 신고대금 장부와 같다(10-16): 분봉 60·120, 일봉 5·10·20·60·120
const MA_DAY = [[5, "#ff8787"], [10, "#74c0fc"], [20, "#e2b65a"], [60, "#9b7bff"], [120, "#adb5bd"]], MA_MIN = MA_DAY.slice(3);
// 영웅문 통합 차트와 같게: 애프터 포함(통합 08~20시, 정규장에서 애프터로 이어진다) | 정규장(09:00~15:30). 애프터만 떼어 붙인 보기는 뺐다(10-19 사용자 "이게 애프터 포함 차트야")
const SESS = [["all", "애프터 포함"], ["reg", "정규장"]];
const OTHER60 = { reg: ["#4dabf7", "정규 60선"], all: ["#e2b65a", "통합 60선"] };   // 분봉에 같이 긋는 다른 시간대 60선(점선)
function maOf(arr, n) { const out = []; let s = 0; arr.forEach((v, i) => { s += v; if (i >= n) s -= arr[i - n]; out.push(i >= n - 1 ? s / n : null); }); return out; }
const chartData = {}, inflight = new Set();
// 확대·십자선 — 신고대금 장부 차트와 같다(10-16): 휠 = 마우스 자리를 축으로 보이는 봉 수 줄이기/늘리기, 마우스 = 십자선 + 그 봉 시고저종·거래량
const zoomOf = {}, crossOf = {};
let crossRaf = 0;

// ── 실시간(SSE) — 체결가·호가·체결은 서버가 밀어준다. 계좌·미체결 같은 나머지만 2초 폴링 ──
let es = null, esKey = "", raf = 0, lastChartDraw = 0;
const lastCum = {}, dirtyParts = new Set();
function openStream() {
  const codes = [...new Set([...S.watch.map((w) => w.code), ...S.holdings.map((h) => h.code)])].join(",");
  const key = codes + "|" + (active || "");
  if (key === esKey && es && es.readyState !== 2) return;
  esKey = key; if (es) es.close();
  es = new EventSource(`/api/stream?codes=${codes}&active=${active || ""}`);
  es.onmessage = (e) => onLive(JSON.parse(e.data));
}
// 체결 알림음(10-23 사용자) — 매수 올라가는 두 음 · 매도 내려가는 두 음. 파일 없이 Web Audio 로 만든다.
// 브라우저는 화면을 한 번 눌러야 소리를 허락한다 — 아무 데나 누르면 그때 켜진다
let actx = null, sndOn = store.get("snd", true), dingAt = 0;
const sndUi = () => { const b = $("sndBtn"); b.textContent = sndOn ? "🔔 알림음 켜짐" : "🔕 알림음 꺼짐"; b.setAttribute("aria-pressed", sndOn); };
document.addEventListener("pointerdown", () => { actx ||= new AudioContext(); if (actx.state === "suspended") actx.resume(); }, { capture: true });
$("sndBtn").onclick = () => { sndOn = !sndOn; store.set("snd", sndOn); sndUi(); if (sndOn) setTimeout(() => ding("buy"), 50); };
sndUi();
function ding(side) {
  const now = performance.now(); if (!sndOn || !actx || now - dingAt < 300) return;   // 한 주문이 여러 번 나눠 체결돼도 0.3초에 한 번
  dingAt = now;
  const [a, b] = side === "buy" ? [660, 990] : [880, 520];
  [a, b].forEach((hz, i) => {
    const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime + i * 0.14;
    o.frequency.value = hz; o.type = "sine";
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.35, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
    o.connect(g).connect(actx.destination); o.start(t); o.stop(t + 0.24);
  });
}
function onLive(d) {
  window.__liveN = (window.__liveN || 0) + 1;                       // 점검용: 받은 실시간 묶음 수
  if (!S) return;
  for (const [c, q] of Object.entries(d.q || {})) {
    const w = S.watch.find((x) => x.code === c); if (w) { w.px = q.px; w.chg = q.chg; if (q.value) w.value = q.value; }
    const h = S.holdings.find((x) => x.code === c); if (h) h.px = q.px;
    if (S.active?.code === c) Object.assign(S.active, { px: q.px, chg: q.chg, high: q.high });
    liveBar(c, q);
    dirtyParts.add("watch").add("charts").add("order");
  }
  if (d.b && S.active?.code === d.b.code) { S.book = d.b.book; dirtyParts.add("book"); }
  if (d.bs) { S.books = Object.assign(S.books || {}, d.bs); dirtyParts.add("book"); }
  if (d.f) { S.fills.push(...d.f); dirtyParts.add("charts").add("tabs"); d.f.forEach((f) => ding(f.side));
    if (d.f.some((f) => f.side === "buy")) { tab = "pos"; poll(); } }   // 매수 체결 → 보유 탭으로 바로(보유 수량은 poll 이 가져온다)
  if (!raf) raf = requestAnimationFrame(flushLive);
}
function flushLive() {
  raf = 0;
  if (dirtyParts.has("watch")) renderWatch();
  if (dirtyParts.has("book")) renderBook();
  if (dirtyParts.has("order")) renderOrder();
  if (dirtyParts.has("tabs")) renderTabs();
  if (dirtyParts.has("charts")) {                                   // 차트는 0.4초에 한 번까지(4장 SVG) — 0.15초면 장중 화면이 바빠 클릭이 늦었다(10-23)
    const wait = 400 -(performance.now() - lastChartDraw);
    if (wait > 0) { setTimeout(() => { dirtyParts.add("charts"); if (!raf) raf = requestAnimationFrame(flushLive); }, wait); dirtyParts.delete("charts"); }
    else { lastChartDraw = performance.now(); renderCharts(); }
  }
  ["watch", "book", "order", "tabs", "charts"].forEach((k) => k !== "charts" && dirtyParts.delete(k));
  dirtyParts.delete("charts");
}
// 체결로 지금 봉을 키운다 — 분봉 '하루 전체'(실시간이 통합 가격), 정규장 시간이면 '정규장'도. 봉 시각은 시작 시각(키움 분봉과 같다)
function liveBar(code, q) {
  const dv = lastCum[code] != null && q.cum >= lastCum[code] ? q.cum - lastCum[code] : 0;
  lastCum[code] = q.cum;
  const dt = new Date(q.t * 1000), hm = dt.getHours() * 100 + dt.getMinutes();
  for (const k of Object.keys(chartData)) {
    if (!k.startsWith(code)) continue;
    const tf = k.slice(6).replace(/(all|reg|after)$/, ""), ses = k.slice(6 + tf.length), d = chartData[k];
    if (tf === "D" || !d?.bars?.length || !(ses === "all" || (ses === "reg" && hm >= 900 && hm <= 1530))) continue;
    const m = +tf, mins = Math.floor((dt.getHours() * 60 + dt.getMinutes()) / m) * m;
    const t = `${dt.getFullYear()}${String(dt.getMonth() + 1).padStart(2, "0")}${String(dt.getDate()).padStart(2, "0")}${String(Math.floor(mins / 60)).padStart(2, "0")}${String(mins % 60).padStart(2, "0")}00`;
    const last = d.bars[d.bars.length - 1];
    if (last.t.slice(0, 12) === t.slice(0, 12)) { last.c = q.px; last.h = Math.max(last.h, q.px); last.l = Math.min(last.l, q.px); last.v += dv; }
    else if (t > last.t) d.bars.push({ t, o: q.px, h: q.px, l: q.px, c: q.px, v: dv });
  }
}

  let tot = 0, w = 0;
  const body = days.map((k) => { const d = D[k], net = d.gross - d.cost; tot += net; if (net > 0) w++;
    return `<tr><td>${k.slice(5).replace("-", ".")}</td><td>${won(net)}</td><td class="${cls(net)}">${pct(net / d.basis * 100)}</td><td class="dim">${won(d.gross)}</td><td class="dim">${fmt(Math.round(d.cost))}</td><td>${fmt(Math.round(d.sell))}</td><td>${d.n}</td><td style="font-family:inherit">${esc([...d.names].join(" · "))}</td></tr>`; }).join("");
  return `<div class="dim" style="padding:6px 8px">${days.length}일 · 번 날 ${w} · 잃은 날 ${days.length - w} · 합계 <b>${won(tot)}원</b> (판 날 기준 실현 손익 · 수수료 각 0.015%·매도세 0.20% 뺀 값 · 보유 중 평가손익은 안 넣음)</div>
    <table style="min-width:720px"><thead><tr><th>날짜</th><th>실현 손익(원)</th><th>수익률</th><th>비용 빼기 전</th><th>수수료·세금</th><th>판 금액</th><th>매도 건</th><th>종목</th></tr></thead><tbody>${body}</tbody></table>`;
}
// 신고대금 장부 '데스크로'— ?add=코드:YYYYMMDD,… 를 받아 종목 + 기준일로 넣고 주소를 지운다
async function takeAdd() {
  const add = new URLSearchParams(location.search).get("add"); if (!add) return;
  history.replaceState(null, "", location.pathname + location.hash);
  const items = add.split(",").map((x) => { const [code, day] = x.split(":"); return { code, day: day || "" }; }).filter((x) => /^\d{6}$/.test(x.code));
  if (!items.length) return;
  const r = await api("/api/pick", { method: "POST", body: { items } }).catch((e) => ({ ok: false, msg: e.message }));
  if (r.ok && r.codes.length) { active = r.codes[r.codes.length - 1]; setTimeout(() => alertMsg(`신고대금 장부에서 ${r.codes.length}종목 넣음 · 기준일 = 신고일`), 2500); }
  else setTimeout(() => alertMsg("종목 넣기 실패 — " + (r.msg || "")), 2500);
}
takeAdd().finally(() => loadRules().then(() => { if (location.hash === "#rules") showRules(true); poll(); setInterval(poll, 2000); setInterval(loadRules, 30000); }));
</script>
